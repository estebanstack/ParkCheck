// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
  configurations.all {
    resolutionStrategy {
      force 'com.google.mlkit:text-recognition:16.0.1'
      force 'com.google.mlkit:text-recognition-bundled-common:17.0.0'
      force 'com.google.mlkit:text-recognition-chinese:16.0.1'
      force 'com.google.mlkit:text-recognition-devanagari:16.0.1'
      force 'com.google.mlkit:text-recognition-japanese:16.0.1'
      force 'com.google.mlkit:text-recognition-korean:16.0.1'
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
